; SN2LAN client configuration.
; Put this file (as config.ini) next to dwmapi.dll in
;   Subnautica2\Binaries\Win64\

[tunnel]
enabled = true
role = client
socket_name = GameNetDriver

; The host's public address (frp server / public IP).
host = @HOST@
host_port = 28015

; Local port: 0 lets the system pick one (use this when running two copies).
bind_port = 0
; IP mode: TCP port for the join handshake (same number as the game's UDP port).
control_port = 7777

; Joined manually from the in-game overlay (F8).
; Uncomment to join automatically once the host is up:
; auto_connect = @HOST@:7777
; auto_connect_delay = 20

; Use the engine's plain UDP driver, like the host.
force_ip_driver = 1

mtu = 1400
passthrough_until_seen = true
peer_timeout_ms = 10000

; In-game overlay (F8) with a manual join box.
overlay = true
; imgui = drawn inside the game window (default), window = separate desktop window.
overlay_mode = imgui

; Verbose log for the first session; set to false once it works.
debug = true
