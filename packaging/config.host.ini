; SN2LAN host configuration.
; Put this file (as config.ini) next to dwmapi.dll in
;   Subnautica2\Binaries\Win64\

[tunnel]
enabled = true
role = host
socket_name = GameNetDriver

; HELLO/tunnel port. Publish it (and UDP 7777) through frp.
bind_address = 0.0.0.0
bind_port = 28015
; IP mode: TCP handshake port (same number as the game's UDP 7777).
control_port = 7777

; Host the game on plain UDP 7777 instead of EOS P2P.
force_ip_driver = 1

mtu = 1400
passthrough_until_seen = true
peer_timeout_ms = 10000

; In-game overlay (F8) showing the room state.
overlay = true
; imgui = drawn inside the game window (default), window = separate desktop window.
overlay_mode = imgui

; Verbose log for the first session; set to false once it works.
debug = true
