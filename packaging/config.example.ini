; SN2LAN configuration
; Put this file (named config.ini) next to dwmapi.dll in
;   Subnautica2\Binaries\Win64\
; Lines starting with ';' or '#' are comments; unknown keys are ignored.

[tunnel]
; Turn the mod on. When disabled it loads but does nothing.
enabled = true

; host   = the player that hosts the save (listens, port is published through frp)
; client = everybody else
role = host

; Which EOS P2P socket carries the tunnel bootstrap traffic.
socket_name = GameNetDriver

; --- host settings -----------------------------------------------------------
; Local UDP port the mod listens on for EOS-tunnel bootstrap traffic. Only used
; when force_ip_driver = 0; publish exactly this port with frp in that mode.
bind_address = 0.0.0.0
bind_port = 28015
; IP mode: TCP handshake port. Publish TCP 7777 (handshake) and UDP 7777 (the
; game's own listen port) on the host's public address.
control_port = 7777

; --- client settings ---------------------------------------------------------
; Address of the host's UDP port (frp server address, or the host's public IP).
; host = your.server.example.com
; host_port = 28015
;
; Optional: connect automatically once the host announces that its listen
; server is up. Leave it commented out to join from the in-game overlay (F8).
; auto_connect = your.server.example.com:7777
;
; Seconds to wait after the host is ready before connecting (1..600).
; auto_connect_delay = 20
;
; In-game overlay (F8) with a manual "join IP:port" box. Default: on.
; overlay = true
; imgui = drawn inside the game window (default), window = separate desktop window.
; overlay_mode = imgui
;
; Extra login options appended to the travel URL. Leave empty: the mod reads
; the game's own "GetGameLoginOptions returning '...'" log line, which carries
; this account's SonarPlayerId. Only set it to override/spoof an identity.
; login_options =

; --- advanced ----------------------------------------------------------------
; Max UDP payload per datagram. 1400 is safe for the internet; lower it to
; 1200 if you see framing warnings. Range 512..2000.
mtu = 1400

; Verbose logging (per-packet lines are rate limited either way).
debug = false

; Keep using EOS for a peer until a direct packet from it actually arrived.
passthrough_until_seen = true

; After this many milliseconds without a direct packet, fall back to EOS again.
peer_timeout_ms = 10000

; Full takeover (build 533): the engine loads UIpNetDriver instead of
; NetDriverEOS, so the host listens on plain UDP 7777 and clients join by IP
; (TCP 7777 handshake, UDP 7777 game data). Set to 1 on BOTH sides.
; The host must publish both TCP 7777 and UDP 7777.
; Set to 0 to keep the official EOS session and only tunnel the data plane.
force_ip_driver = 1
